{day:2,blk:'H5 · Vibe coding',type:'code',min:5,title:'La interfaz no conoce Catastro',sub:'Conoce un contrato propio.',
 code:`<span class="c">type</span> Parcel = {
  refcat: string;
  parcelAreaM2: number | null;
  constructedAreaM2: number | null;
  occupancyRatio: number | null;
  mainUse: string | null;
  constructionYear: number | null;
  source: "catastro";
  fetchedAt: string;
}`,
 side:[{h:'Fijaos en null',t:'Un dato puede faltar. El tipo lo dice en voz alta.',c:'orange'},{h:'Si Catastro cambia',t:'Arreglas el adaptador, no 14 componentes.',c:'lime'}],
 script:`Así es el contrato que conoce la interfaz: un tipo Parcel.
Fijaos en dos cosas. Primera: muchos campos pueden ser null. Un dato puede faltar, y el tipo lo dice en voz alta; eso obliga a la interfaz y al score a decidir qué hacer cuando falta.
Segunda: la interfaz no sabe nada de cómo llama Catastro a sus campos. Si mañana Catastro cambia su formato, arreglamos el adaptador, no catorce componentes.`},

{day:2,blk:'H5 · Vibe coding',type:'demo',min:13,tool:'Lovable',title:'Nueva funcionalidad: “Nuevo estudio”',ds:'Demo C · Hilo vibe coding 4 de 6',
 steps:['Lee el prompt por secciones: objetivo, contrato, arquitectura, límites, UI.','Lánzalo. Mientras genera: “el valor no está en la espera, está en el contexto que le hemos dado”.','Revisa el plan que propone ANTES de aprobar.','Revisa el resultado: ¿validación en domain? ¿escritura en el repositorio? ¿estados de carga, error y vacío?','Pide un cambio pequeño (p. ej. mensaje de error más claro) y enseña el diff.','Prueba con una referencia inválida pegada en el textarea.','Si falla: error exacto → hipótesis → corrección mínima. No lo escondas.'],
 prompt:P4,
 script:`Vamos a generar una funcionalidad nueva en PARCELAPP: la pantalla Nuevo estudio.
Os leo el prompt por secciones. Objetivo: qué hace el usuario. Contrato: cómo validamos las referencias. Arquitectura: dónde vive cada cosa. Límites: nada de Catastro desde React, nada de service_role, no tocar el scoring. Y la interfaz con sus estados.
Lo lanzo. Mientras genera, fijaos en que el valor no está en la espera sino en el contexto que le hemos dado.
Cuando termina no pulso aceptar mentalmente y sigo. Reviso. ¿Dónde ha puesto la validación? ¿Ha metido lógica en un componente? ¿Maneja la carga y el error? ¿Qué pasa si pego una referencia mal escrita?
Después hago un cambio pequeño y os enseño el diff: qué archivos cambió y qué líneas. Cambios pequeños son cambios auditables.`},

{day:2,blk:'H5 · Vibe coding',type:'cards',min:4,title:'Tres errores clásicos',sub:'Y cómo salir de ellos.',ncols:3,
 cards:[{t:'Pedir demasiado',d:'Un paso enorme es imposible de revisar.',c:'red'},{t:'Aceptar lo que no entiendes',d:'Mañana no sabrás arreglarlo.',c:'red'},{t:'Parchear sobre parches',d:'Hasta que nadie sabe qué ocurre.',c:'red'}],
 band:{k:'Cuando el agente falla',v:'Error exacto + archivo exacto + comportamiento esperado. Primero diagnóstico, después un cambio pequeño.'},
 script:`Tres errores clásicos.
Uno: pedir demasiado en un solo paso.
Dos: aceptar código que no entendemos.
Tres: arreglar un bug añadiendo parches hasta que nadie sabe qué ocurre.
Cuando el agente falla, volvemos a hechos: error exacto, archivo exacto y comportamiento esperado. Pedimos primero un diagnóstico y después un cambio pequeño. Y comprobamos el diff.
En la siguiente hora entramos en el corazón de PARCELAPP: las reglas que convierten datos en una puntuación. Ahí se ve clarísimo por qué la lógica de negocio no debe depender de la IA generativa.`},

{day:2,blk:'H6 · Scoring',type:'section',min:1,num:'H6',st:'Scoring explicable',ss:'Las reglas deciden. La IA explica.',seed:41,
 script:`Sexta hora: el scoring.`},

{day:2,blk:'H6 · Scoring',type:'quote',tone:'light',min:6,
 text:'Un 87 no significa “esta parcela es buena”.',
 small:'Significa: según este conjunto de criterios y pesos, esta parcela merece más atención que otras.',
 script:`Un score de 87 no significa esta parcela es buena. Significa: según este conjunto de criterios y pesos, esta parcela merece más atención que otras.
Esa diferencia es esencial.
Podemos asignar puntos por superficie, baja ocupación construida, antigüedad, uso y presencia de vecinos candidatos. Pero esos pesos son una decisión de negocio. Una promotora residencial y una constructora industrial valoran cosas diferentes.
Por eso el score debe ser explicable y configurable. Si un técnico ve 87, debería poder abrir el detalle y leer de dónde salen esos 87 puntos. Nada de caja negra misteriosa.`},

{day:2,blk:'H6 · Scoring',type:'weights',min:5,title:'Score de 0 a 100',sub:'Un ranking interno y configurable.',
 items:[[25,'Superficie','#A3E635'],[25,'Baja ocupación','#22C3DE'],[20,'Antigüedad','#F7913D'],[15,'Uso','#0F7A6E'],[15,'Vecinos','#8391A2']],
 script:`Así reparte PARCELAPP los cien puntos en su versión de demostración.
Veinticinco por superficie. Veinticinco por baja ocupación construida. Veinte por antigüedad. Quince por uso. Y quince por tener vecinos que también son candidatos.
Estos pesos no son una verdad matemática. Son una decisión de negocio que el cliente puede cambiar.`},

{day:2,blk:'H6 · Scoring',type:'code',min:7,title:'Una función pura',sub:'Misma entrada + mismas reglas = mismo resultado.',
 code:`calculateOpportunityScore(parcel, rules)
<span class="m">→</span> {
  total: 82,
  breakdown: { area: 25, occupancy: 25,
               age: 12, use: 12, neighbours: 8 },
  reasons: [ ... ],
  warnings: [ ... ]
}`,
 side:[{h:'Testable',t:'Sin red, sin Supabase, sin IA.',c:'lime'},{h:'Explicable',t:'El usuario ve qué regla sumó cada punto.',c:'cyan'},{h:'Estable',t:'Cambiar la interfaz o n8n no cambia el cálculo.',c:'orange'}],
 script:`Os presento un concepto de programación muy útil: función pura.
Le damos unos datos y unas reglas y devuelve siempre el mismo resultado. No llama a Catastro, no manda correos, no escribe en la base de datos.
calculateOpportunityScore recibe la parcela y las reglas, y devuelve el total, el desglose, las razones y los avisos.
Esto la hace fácil de probar: le pasamos una parcela ficticia y comprobamos que devuelve lo esperado. Si mañana cambiamos la interfaz o n8n, el cálculo no cambia.
La IA puede ayudarnos a escribir esta función, pero el resultado no depende de que un modelo opine. Es matemática y reglas. Esto es exactamente lo que debe vivir en el dominio.`},

{day:2,blk:'H6 · Scoring',type:'html',min:6,title:'Los bordes rompen sistemas',sub:'Prueba 1.499 y 1.500, no solo 5.000.',
 html:`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:10px">
 ${[['1.499 m²','0 puntos','red'],['1.500 m²','8 puntos','orange'],['2.500 m²','16 puntos','cyan'],['5.000 m²','25 puntos','lime']].map(x=>`<div class="card" style="border-left:none;border-top:9px solid ${C[x[2]]};text-align:center;padding:36px 16px"><h3 style="font-size:40px">${x[0]}</h3><p style="font-size:28px;font-weight:700;color:var(--text)">${x[1]}</p></div>`).join('')}</div>
 <div class="callout">¿Y si falta la superficie?<small>Ausente no es cero, y nunca puntúa como favorable. La regla no suma y deja un aviso.</small></div>`,
 script:`Los sistemas se rompen en los bordes.
¿Qué pasa con 1.499 metros? Cero puntos. ¿Y con 1.500? Ocho. Justo ahí es donde aparecen los errores de mayor o igual contra mayor estricto.
¿Qué pasa si la superficie construida es cero? ¿Y si falta el año de construcción? ¿Y si Catastro devuelve un uso que nunca hemos visto?
No queremos que la aplicación convierta un dato desconocido en cero silenciosamente. Desconocido y cero no significan lo mismo.
Por eso definimos políticas: si falta el año, esa regla no puntúa y añadimos un aviso. El desglose devuelve no solo puntos, también motivos y avisos. Eso luego alimenta la interfaz y el preestudio.`},

{day:2,blk:'H6 · Scoring',type:'html',min:5,title:'Un score sin explicación es una caja negra barata',sub:'PARCELAPP enseña el desglose.',
 html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start">
 <div class="mock"><div class="mh">Parcela demo <span>rules 1.0-demo</span></div><div class="mb">
 <div style="font-size:64px;font-weight:800;letter-spacing:-.03em">82<span style="font-size:30px;color:var(--muted)"> / 100</span></div>
 <div style="font-size:24px;line-height:1.9;margin-top:6px">${[['+25','Superficie'],['+25','Baja ocupación'],['+12','Antigüedad'],['+12','Uso'],['+8','Vecinos']].map(r=>`<div><b style="color:var(--teal);display:inline-block;width:70px">${r[0]}</b>${r[1]}</div>`).join('')}</div></div></div>
 <div><div class="card" style="border-left-color:var(--lime);margin-bottom:22px"><h3>Razón</h3><p>Cumple el umbral de superficie y tiene baja ocupación construida.</p></div>
 <div class="card" style="border-left-color:var(--orange)"><h3>Límite</h3><p>Requiere comprobar planeamiento, propiedad, cargas y viabilidad.</p></div></div></div>`,
 script:`Un score sin explicación es una caja negra barata.
PARCELAPP enseña el desglose: veinticinco por superficie, veinticinco por baja ocupación, doce por antigüedad, doce por uso y ocho por vecinos. Ochenta y dos.
Debajo, la versión de reglas que lo produjo.
Al lado, la razón en lenguaje humano y, muy importante, el límite: lo que hay que comprobar antes de tomar ninguna decisión.`},

{day:2,blk:'H6 · Scoring',type:'code',min:7,title:'La personalización es el producto',sub:'Los criterios pertenecen a la empresa.',
 code:`{
  "rules_version": "1.1-constructora-a",
  "min_area": 2500,
  "max_occupancy": 0.35,
  "preferred_uses": ["INDUSTRIAL", "SOLAR"],
  "min_score": 70
}`,
 side:[{h:'Constructora A',t:'Suelo industrial grande y poco ocupado.',c:'cyan'},{h:'Promotora B',t:'Otros pesos, otras fuentes.',c:'orange'},{h:'Condición',t:'Versionar siempre: score + breakdown + rules_version.',c:'lime'}],
 script:`Aquí aparece el verdadero producto comercial. No vendemos un score universal. Vendemos un motor de criterios configurable según cómo trabaja cada cliente.
Cliente A busca parcelas grandes y poco ocupadas. Cliente B prioriza agrupaciones contiguas. Cliente C tiene un umbral mínimo distinto. Mismo motor, reglas distintas.
Las reglas se guardan como configuración. Pero con una condición: versionarlas. Si hoy una parcela obtiene 82 con la versión 3 y mañana 71 con la versión 4, debemos saber por qué.
Esto convierte una demo simpática en software empresarial defendible.`},

{day:2,blk:'H6 · Scoring',type:'demo',min:12,tool:'Lovable',title:'El score de verdad, con tests',ds:'Demo D · Hilo vibe coding 5 de 6',
 steps:['Lanza el prompt del score.','Mientras genera, abre scoring_rules.json y explica cada peso como decisión de negocio.','Enseña los tests que ha creado: 1499, 1500, 2500, 5000 y ausente.','Abre el detalle de una parcela: breakdown + rules_version.','Cambia un peso en scoring_rules.json, sube la versión y enseña cómo cambia el ranking.','Remata: “no he tocado la interfaz ni la integración con Catastro, solo configuración de negocio”.'],
 prompt:P5,
 script:`Le pedimos a Lovable la función del score. Fijaos en lo que exige el prompt: función pura, pesos, umbrales, qué hacer con los datos ausentes, tests de los bordes y mostrar el desglose.
Mientras genera, abro el archivo de reglas. Cada peso es una decisión de negocio, no una verdad matemática.
Aquí están los tests: 1.499, 1.500, 2.500, 5.000 y superficie ausente.
Ahora cambio el peso de superficie y el de vecinos, subo la versión y recalculo. Mirad cómo cambia el ranking.
No he tocado la interfaz ni la integración con Catastro. Solo he cambiado configuración de negocio. Ésta es la señal de una buena separación de responsabilidades.
Y éste es el momento comercial: el cliente nos dice qué considera oportunidad, y nosotros parametrizamos el motor sin reconstruir la aplicación.`},

{day:2,blk:'H6 · Scoring',type:'chat',min:1,q:'¿Quién decide que la parcela tiene un 82?',hint:'En el chat: las reglas o el modelo de IA.',opts:['Las reglas','El modelo de IA'],
 script:`Pregunta al chat: ¿quién decide que la parcela tiene un 82, las reglas o el modelo de IA?
Las reglas. Siempre. El modelo puede ayudarnos a escribir la función y a explicar el resultado, pero no decide la puntuación.
Paramos quince minutos y al volver le damos a la IA su papel: explicar sin inventar.`},

{day:2,blk:'Pausa',type:'break',min:15,mins:15,next:'H7 · n8n + IA + preestudio',
 script:`Pausa de quince minutos.`},

{day:2,blk:'H7 · n8n + IA',type:'section',min:1,num:'H7',st:'n8n, IA y preestudio',ss:'Automatizar sin regalarle el volante al modelo.',seed:47,
 script:`Séptima hora: n8n como orquestador, IA y preestudio.`},

{day:2,blk:'H7 · n8n + IA',type:'flow',min:7,title:'Workflow de producción',sub:'n8n orquesta el proceso externo.',
 steps:[{t:'Webhook',d:'entrada'},{t:'Validar',d:'referencia'},{t:'Catastro',d:'HTTP'},{t:'Normalizar',d:'contrato'},{t:'Supabase',d:'upsert'},{t:'Responder',d:'estado'}],
 callout:'Error externo → estado controlado.',calloutSmall:'Reintento → idempotencia. Respuesta original → trazabilidad.',
 script:`Volvemos a n8n con una arquitectura mucho más clara.
Su trabajo es coordinar pasos: recibir un estudio, validar, llamar al adaptador de Catastro, normalizar, guardar con upsert y responder con un estado.
No queremos esconder reglas centrales en veinte nodos IF. Si la regla del score es crítica y la necesitan la interfaz, los tests y n8n, vive en código, en el dominio.
n8n brilla cuando conecta sistemas y gobierna procesos. Es excelente para lo que cambia a menudo: correo, CRM, notificaciones, PDFs.
El criterio no es n8n sí o no. El criterio es responsabilidad y coste de cambio.`},

{day:2,blk:'H7 · n8n + IA',type:'cols',min:7,title:'Lotes, límites y reintentos',sub:'Más paralelismo no siempre significa más inteligencia.',ncols:3,
 cols:[{h:'Mal',c:'red',items:['500 referencias','500 peticiones a la vez','API enfadada']},{h:'Mejor',c:'lime',items:['Prefiltro','Lotes controlados','Caché y reintento con espera']},{h:'Estado final',c:'cyan',items:['completed','partial: 980 bien, 20 fallidas','failed','Reanudar solo las 20']}],
 script:`Si analizamos mil parcelas, no lanzamos mil peticiones simultáneas sin control. Trabajamos por lotes: de veinte, de cincuenta, lo que permita el servicio.
Distinguimos reintentos. Un 500 temporal quizá merece reintento con espera. Un 400 no, ya lo vimos ayer.
Añadimos tiempos máximos, límites de concurrencia y registro de fallos.
Una ejecución puede terminar parcialmente: 980 parcelas procesadas y 20 fallidas. Un buen sistema reanuda esas 20 sin rehacer todo. Y el usuario sabe exactamente qué ocurrió.`},

{day:2,blk:'H7 · n8n + IA',type:'code',min:9,title:'La IA recibe hechos, no libertad creativa',sub:'Grounding: responder apoyándose solo en lo suministrado.',
 code:`{
  "observed": { ...datos normalizados... },
  "derived": { "score": 82, "occupancy": 0.12 },
  "neighbours": [ ... ],
  "pending_checks": [
    "planeamiento", "propiedad", "cargas"
  ]
}`,
 side:[{h:'Observado',t:'Viene de una fuente y un snapshot.',c:'cyan'},{h:'Derivado',t:'Fórmula conocida y reproducible.',c:'lime'},{h:'Pendiente',t:'No se inventa. Se señala para comprobar.',c:'orange'}],
 script:`Ahora sí entra la IA generativa. Pero entra después de tener hechos estructurados.
Le damos lo observado: superficie, construido, uso, antigüedad, con su fuente. Lo derivado: el score, el desglose, la ocupación. Los vecinos. Y lo pendiente de comprobar.
Le pedimos un resumen con un esquema de salida concreto y le prohibimos inventar datos que no estén presentes. Esto se llama grounding: la respuesta se apoya en información suministrada.
Si falta la edificabilidad, debe decir no disponible o requiere comprobación, no imaginar una cifra plausible.
La IA es muy buena explicando y sintetizando. No necesitamos usarla para dividir 780 entre 6.245. Para eso ya existen las matemáticas desde hace un tiempo.`},

{day:2,blk:'H7 · n8n + IA',type:'html',min:6,title:'El preestudio que vende la demo',sub:'Una salida ejecutiva, pero honesta.',
 html:`<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:34px;align-items:start">
 <div class="mock"><div class="mh">PARCELAPP · Preestudio <span>demo</span></div><div class="mb" style="padding:30px 34px">
 <div style="font-size:40px;font-weight:800;letter-spacing:-.02em">Parcela demo · Score 82/100</div>
 <div style="font-size:22px;color:var(--muted);margin:12px 0 22px">Superficie 6.245 m² · Construido 780 m² · Ocupación 12,5 %</div>
 <div style="font-size:24px;font-weight:800;margin-bottom:6px">Razones de priorización</div>
 <div style="font-size:22px;line-height:1.7;color:#3B4858">Baja ocupación construida<br>Antigüedad relevante<br>2 colindantes candidatas</div>
 <div style="font-size:22px;font-weight:800;color:var(--orange);margin-top:20px">Pendiente: planeamiento, registro, cargas y viabilidad.</div></div></div>
 <div><div class="card" style="border-left-color:var(--orange);margin-bottom:22px"><h3>Salida</h3><p>HTML, PDF, email o CRM según el proyecto.</p></div>
 <div class="card" style="border-left-color:var(--cyan)"><h3>Traza</h3><p>Fecha de la fuente, versión de reglas y modelo usado.</p></div></div></div>`,
 script:`El preestudio es la pieza que hace tangible todo el flujo.
Un técnico abre una oportunidad y obtiene una ficha con los datos, el score, las razones, los vecinos y lo que queda por comprobar.
Fijaos en la última línea, en naranja: pendiente de planeamiento, registro, cargas y viabilidad. Esa línea no resta valor: da confianza.
El informe separa hechos, derivados y texto generado por IA. Y lleva su traza: fecha de la fuente, versión de reglas y modelo usado.
Datos fuente, métricas calculadas, interpretación asistida. Ésa es la estructura.`},

{day:2,blk:'H7 · n8n + IA',type:'html',min:4,title:'Vecinos + score = contexto',sub:'No “fusionamos parcelas”. Detectamos dónde mirar.',
 html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center">
 <div style="height:470px;border-radius:20px;overflow:hidden;border:1px solid var(--line)">${parcels({w:700,h:470,cols:5,rows:3,seed:21,hi:[2,7,12],dark:false,scores:{2:78,7:91,12:74}})}</div>
 <div><div class="card" style="border-left-color:var(--lime);margin-bottom:22px"><h3>Parcela principal</h3><p>Score 91.</p></div>
 <div class="card" style="border-left-color:var(--cyan);margin-bottom:22px"><h3>Colindantes</h3><p>Dos vecinas también superan el umbral interno.</p></div>
 <div class="card" style="border-left-color:var(--orange)"><h3>Resultado</h3><p>Priorizar un análisis conjunto.</p></div></div></div>`,
 script:`Las parcelas vecinas añaden contexto. Una parcela aislada puede ser interesante; tres candidatas contiguas pueden cambiar completamente la prioridad.
Pero cuidado: detectar contigüidad no significa que podamos comprar, agrupar o construir. Seguimos hablando de una señal para estudiar.
El resultado que proponemos no es fusionar parcelas. Es priorizar un análisis conjunto.`},

{day:2,blk:'H7 · n8n + IA',type:'demo',min:21,tool:'n8n',title:'De principio a fin: del estudio al preestudio',ds:'Demo E · Hilo vibe coding 6 de 6',
 steps:['Lanza el prompt del preestudio en Lovable (tarda: mientras, sigue con n8n).','Empieza desde PARCELAPP, no desde n8n: crea o abre un estudio.','Enseña el estado running: “la app no se bloquea”.','Salta a n8n solo para enseñar que el trabajo ocurre detrás.','Enseña el nodo de IA: el JSON de entrada con observed / derived / pending_checks y el prompt que prohíbe inventar.','Vuelve a la app: ranking, detalle, vecinos, motivos.','Pulsa Generar preestudio. Si tarda o falla: enseña el preestudio de respaldo.','Revisa en voz alta: ¿cada afirmación se puede rastrear a un dato o a una fórmula?','Cierra: “la tecnología desaparece y queda el flujo de trabajo del técnico”.'],
 prompt:P6,
 script:`Voy a recorrer el flujo completo.
Empiezo desde PARCELAPP, no desde n8n, porque así lo vivirá el usuario. Creo un estudio. Fijaos en el estado: está procesando y la app no se bloquea.
Salto a n8n solo un momento para que veáis que el trabajo ocurre detrás: obtenemos datos, normalizamos, persistimos, calculamos el score y buscamos vecinos.
Aquí está el nodo de IA. Mirad lo que recibe: lo observado, lo derivado y lo pendiente. Y mirad el prompt: no puede inventar nada que no esté en ese JSON.
Vuelvo a la app. Ranking, detalle, vecinos, motivos. Y genero el preestudio.
Ahora lo reviso en voz alta, como haría un técnico: ¿puedo rastrear cada afirmación importante a un dato o a una fórmula?
Ninguna herramienta por sí sola es PARCELAPP. El producto aparece por la coordinación: interfaz para trabajar, base de datos para recordar, dominio para decidir, n8n para orquestar, Catastro como fuente e IA para explicar.`,
 notes:`Si la IA inventa algo en directo: ¡mejor! Úsalo: "esto es exactamente lo que hay que rechazar; por eso separamos observado / derivado / pendiente".`},

{day:2,blk:'H8 · Producto',type:'section',min:1,num:'H8',st:'De demo a producto',ss:'Que funcione es el principio, no el final.',seed:53,
 script:`Última hora. La pregunta más incómoda: ¿qué falta para que esto deje de ser una demo y parezca un producto que puedas enseñar a un cliente?`},

{day:2,blk:'H8 · Producto',type:'cols',min:7,title:'La IA corre. Git pone las barandillas.',sub:'Más código generado exige más mecanismos de control, no menos.',ncols:3,
 cols:[{h:'AGENTS.md',c:'cyan',items:['Arquitectura','Seguridad','Definición de terminado','Reglas persistentes']},{h:'Commits',c:'lime',items:['Pequeños','Revisables','Reversibles']},{h:'Diff',c:'orange',items:['¿Qué cambió?','¿Por qué?','¿Rompe capas?']}],
 band:{k:'Regla',v:'Vibe coding sin revisión = velocidad para equivocarse.'},
 script:`Hasta ahora hemos construido capacidad. Hardening significa reducir la probabilidad de que esa capacidad falle de forma peligrosa o imprevisible.
Primero, Git. Cada cambio importante queda versionado. Podemos volver atrás, comparar y revisar.
Segundo, las reglas del agente en AGENTS.md: convenciones, límites y arquitectura.
Tercero, pruebas. El scoring, por ejemplo, con tests de casos conocidos.
Cuarto, secretos. Nunca en el frontend ni dentro del repositorio.
Quinto, entornos. Desarrollo no debería ser producción.
La IA nos permite generar más código. Eso aumenta, no reduce, la necesidad de tener mecanismos de control.`},

{day:2,blk:'H8 · Producto',type:'table',min:6,title:'Matriz de fallos',sub:'Una demo seria sabe qué hacer cuando algo falla.',
 head:['Qué pasa si…','Respuesta del sistema'],
 rows:[['La referencia es inválida','Rechazo inmediato con mensaje claro'],['Catastro no responde','Reintento con espera · estado partial'],['Falta un campo','Desconocido, no cero · aviso visible'],['Llega un duplicado','Upsert: nunca dos filas'],['Un usuario pide datos ajenos','RLS lo impide en la base de datos'],['La IA inventa','Se rechaza: grounding y validación del esquema']],
 script:`Un producto profesional se diseña preguntando qué pasa si.
¿Qué pasa si la referencia es inválida? Rechazo inmediato con un mensaje claro.
¿Si Catastro no responde? Reintento con espera y estado parcial.

const dayStart={}; S.forEach((s,i)=>{ if(dayStart[s.day]===undefined) dayStart[s.day]=i; });
const dayCount=d=>S.filter(s=>s.day===d).length;
function footer(s,i){
  const n=i-dayStart[s.day]+1;
  return `<div class="foot"><b>PARCELAPP</b><span>Día ${s.day} · ${esc(s.blk)}</span><span class="n">${n} / ${dayCount(s.day)}</span></div>`;
}
function head(s){ return `${s.title?`<h1 class="t">${esc(s.title)}</h1>`:''}${s.sub?`<p class="sub">${esc(s.sub)}</p>`:''}`; }
function cardsHTML(cards,n){ return `<div class="grid" style="grid-template-columns:repeat(${n||cards.length},1fr)">${cards.map(c=>`<div class="card" style="border-left-color:${C[c.c]||C.cyan}"><h3>${esc(c.t)}</h3><p>${esc(c.d)}</p></div>`).join('')}</div>`; }
function bandHTML(b){ return b?`<div class="band"><div class="k">${esc(b.k)}</div><div class="v">${esc(b.v)}</div></div>`:''; }

function renderSlide(i){

    case 'code':

    case 'table':
      inner=head(s)+`<table class="tb"><tr>${s.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`; break;
    case 'chips':
      inner=head(s)+`<div class="chips">${s.items.map((x,k)=>`<div class="chip">${esc(x)}<span>¿dónde vive?</span></div>`).join('')}</div>`; break;
    case 'html':
      inner=head(s)+s.html; break;
    case 'demo':
      cls='dark';
      inner=`<div class="parcelbg" style="opacity:.25">${parcels({seed:71,hi:[]})}</div><div class="demo" style="position:relative"><div class="pulse"></div><div class="dk">Demo en directo · ${esc(s.tool)}</div><div class="dt">${esc(s.title)}</div><div class="ds">${esc(s.ds)}</div></div>`; break;
    case 'chat':

  }
  return `<div class="slide ${cls}">${inner}${footer(s,i)}</div>`;
}

const VIEW=(location.hash||'').toLowerCase().indexOf('proyector')>=0?'proj':'pres';
const st={ i:0, black:false };
const enterAt={ t:Date.now() };
let chan=null; try{ chan=new BroadcastChannel('parcelapp-master'); }catch(e){}
let projWin=null;
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
st.i=Math.min(S.length-1,Math.max(0,parseInt(lsGet('pa_i','0'),10)||0));

function send(msg){
  msg.src=VIEW;
  try{ chan&&chan.postMessage(msg); }catch(e){}
  try{ if(projWin&&!projWin.closed) projWin.postMessage(msg,'*'); }catch(e){}
  try{ if(window.opener&&!window.opener.closed) window.opener.postMessage(msg,'*'); }catch(e){}
}
function onMsg(m){
  if(!m||m.src===VIEW) return;
  if(m.type==='state'){ const ch=m.i!==st.i; st.i=m.i; st.black=m.black; if(ch) enterAt.t=Date.now(); update(false); }
  else if(m.type==='nav'){ go(st.i+m.d); }
  else if(m.type==='hello' && VIEW==='pres'){ send({type:'state',i:st.i,black:st.black}); }
}
if(chan) chan.onmessage=e=>onMsg(e.data);
window.addEventListener('message',e=>{ if(e.data&&e.data.type) onMsg(e.data); });

function fit(frame,stage){
  const w=frame.clientWidth, h=frame.clientHeight; if(!w||!h) return;
  const sc=Math.min(w/1600,h/900);
  stage.style.transform=`translate(${(w-1600*sc)/2}px,${(h-900*sc)/2}px) scale(${sc})`;
}
const frames=[];
function makeFrame(el){ const st=document.createElement('div'); st.className='stage'; el.appendChild(st); frames.push([el,st]); try{ new ResizeObserver(()=>fit(el,st)).observe(el); }catch(e){} return st; }
window.addEventListener('resize',()=>frames.forEach(f=>fit(f[0],f[1])));

function go(n){
  n=Math.max(0,Math.min(S.length-1,n));
  if(n===st.i) return;
  st.i=n; enterAt.t=Date.now(); lsSet('pa_i',String(n));
  update(true);
}
function setBlack(v){ st.black=v; update(true); }

/* cuenta atrás de pausas */
function tickCountdowns(){
  document.querySelectorAll('.count').forEach(el=>{
    const total=parseInt(el.dataset.mins,10)*60, left=Math.max(0,total-Math.floor((Date.now()-enterAt.t)/1000));
    el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  });
}

let projStage, projBlack;
function buildProj(){
  document.getElementById('app').innerHTML=`<div id="proj"><div class="frame" id="pf"></div><div class="blackout" id="pb"><span>PARCELAPP</span></div></div><div class="projhint" id="ph">Comparte esta ventana en Zoom · F pantalla completa · ← → también funcionan aquí</div>`;
  projStage=makeFrame(document.getElementById('pf'));
  projBlack=document.getElementById('pb');
  setTimeout(()=>{ const h=document.getElementById('ph'); if(h) h.style.opacity=0; },6000);
  send({type:'hello'});
}
function updateProj(){
  projStage.innerHTML=renderSlide(st.i);
  fit(document.getElementById('pf'),projStage);
  projBlack.classList.toggle('on',st.black);
  tickCountdowns();
}

       <button class="pbtn" id="tslow" aria-label="Más lento">Lento [</button><span class="val" id="tspeed"></span><button class="pbtn" id="tfast" aria-label="Más rápido">] Rápido</button>
       <button class="pbtn" id="tsm" aria-label="Letra más pequeña">A−</button><span class="val" id="tfont"></span><button class="pbtn" id="tlg" aria-label="Letra más grande">A+</button>
       <button class="pbtn" id="ttop">Arriba</button>
      </div>
      <div class="telescroll" id="tscroll"><div class="telemark"></div><div class="teletext" id="ttext"></div></div>
     </div>
    </div>
   </div>
  </div>
  <div class="ov" id="ov"></div>`;
  curStage=makeFrame(document.getElementById('fcur'));
  nextStage=makeFrame(document.getElementById('fnext'));
  const $=id=>document.getElementById(id);
  $('bprev').onclick=()=>go(st.i-1);
  $('bnext').onclick=()=>go(st.i+1);
  $('bblack').onclick=()=>setBlack(!st.black);
  $('bov').onclick=toggleOv;
  $('bd1').onclick=()=>{ go(dayStart[1]); resetTimer(); };
  $('bd2').onclick=()=>{ go(dayStart[2]); resetTimer(); };
  $('btimer').onclick=toggleTimer;
  $('breset').onclick=resetTimer;
  $('bproj').onclick=openProj;
  $('bcopy').onclick=()=>copy(S[st.i].prompt||'');
  $('dopen').onclick=()=>{ const u=$('durl').value.trim(); if(!u){ toast('Pega primero la URL'); return; } lsSet('pa_url_'+S[st.i].tool,u); window.open(u,'_blank'); };
  $('durl').onchange=()=>lsSet('pa_url_'+S[st.i].tool,$('durl').value.trim());
  $('tplay').onclick=togglePlay;
  $('tslow').onclick=()=>setSpeed(tele.speed-0.2);
  $('tfast').onclick=()=>setSpeed(tele.speed+0.2);
  $('tsm').onclick=()=>setFont(tele.font-2);
  $('tlg').onclick=()=>setFont(tele.font+2);
  $('ttop').onclick=()=>{ $('tscroll').scrollTop=0; };
  setSpeed(tele.speed); setFont(tele.font);
  buildOv();
  requestAnimationFrame(teleLoop);
}
const DEF_URL={ 'Lovable':'https://lovable.dev', 'Supabase':'https://supabase.com/dashboard', 'n8n':'' };
function updatePres(){
  const s=S[st.i], $=id=>document.getElementById(id);
  $('pblk').textContent=`Día ${s.day} · ${s.blk}`;
  $('ppos').textContent=`${st.i-dayStart[s.day]+1}/${dayCount(s.day)} (total ${st.i+1}/${S.length})`;
  $('bblack').classList.toggle('on',st.black);
  $('pprog').style.width=((st.i-dayStart[s.day]+1)/dayCount(s.day)*100)+'%';
  curStage.innerHTML=renderSlide(st.i);
  nextStage.innerHTML=st.i+1<S.length?renderSlide(st.i+1):'';
  $('nexttitle').textContent=st.i+1<S.length?titleOf(st.i+1):'Fin';
  frames.forEach(f=>fit(f[0],f[1]));
  $('ttext').innerHTML=(s.script||'').split('\n').map(p=>`<p>${esc(p)}</p>`).join('');
  $('tscroll').scrollTop=0;
  $('pnotes').textContent=s.notes||'—';
  $('notesbox').style.display=s.notes?'block':'none';
  $('promptbox').style.display=s.prompt?'block':'none';
  $('ptext').textContent=s.prompt||'';
  if(s.type==='demo'){
    $('demobox').style.display='block';
    $('dsteps').innerHTML=s.steps.map(x=>`<li>${esc(x)}</li>`).join('');
    $('durl').value=lsGet('pa_url_'+s.tool,DEF_URL[s.tool]||'');
    $('durl').placeholder=`URL de ${s.tool}`;
  } else $('demobox').style.display='none';
  document.querySelectorAll('.ovc').forEach(el=>el.classList.toggle('cur',+el.dataset.i===st.i));
  tickCountdowns();
}
function titleOf(i){ const s=S[i]; return s.title||s.st||s.q||s.text||(s.type==='break'?'Pausa':'')||s.dayTitle||''; }

/* reloj */
function toggleTimer(){
  const b=document.getElementById('btimer');
  if(!T.dayStart){ T.dayStart=Date.now(); T.running=true; enterAt.t=Date.now(); }
  else if(T.running){ T.running=false; T.pauseAt=Date.now(); }
  else { T.pausedAcc+=Date.now()-T.pauseAt; T.running=true; T.pauseAt=null; }
  b.textContent=T.running?'Pausar reloj':'Reanudar reloj';
  b.classList.toggle('on',!T.running&&!!T.dayStart);
}
function resetTimer(){ T.running=false; T.dayStart=null; T.pausedAcc=0; T.pauseAt=null; const b=document.getElementById('btimer'); b.textContent='Iniciar reloj de clase'; b.classList.remove('on'); }
function tickPres(){
  const $=id=>document.getElementById(id), s=S[st.i];
  try{ $('tclock').textContent=new Date().toLocaleTimeString('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit'}); }catch(e){ $('tclock').textContent=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
  const el=dayElapsed(); $('tday').textContent=fmt(el);
  const sl=Date.now()-enterAt.t; $('tslide').textContent=fmt(sl);
  const plan=s.min*60000, r=sl/plan;
  $('tplan').textContent=`previsto ${s.min} min`;
  const bar=$('rbar'); bar.style.width=Math.min(100,r*100)+'%';
  bar.style.background=r<0.8?'var(--lime)':(r<=1?'var(--amber)':'var(--red)');
  if(T.dayStart){
    const exp=plannedBefore(st.i)*60000, d=Math.round((el-exp)/60000);
    const dl=$('tdelta');
    dl.textContent=d===0?'en hora':(d>0?`vas ${d} min tarde`:`vas ${-d} min adelantado`);
    dl.style.color=Math.abs(d)<=2?'var(--lime)':(d>0?'var(--red)':'var(--cyan)');
  } else { $('tdelta').textContent='pulsa Iniciar al empezar'; $('tdelta').style.color='#8391A2'; }
}

/* teleprompter */
let lastT=performance.now(), acc=0;
function teleLoop(t){
  const dt=(t-lastT)/1000; lastT=t;
  if(tele.play){ const el=document.getElementById('tscroll'); if(el){ acc+=tele.speed*28*dt; const px=Math.floor(acc); if(px>0){ el.scrollTop+=px; acc-=px; } } }
  requestAnimationFrame(teleLoop);
}
function togglePlay(){ tele.play=!tele.play; const b=document.getElementById('tplay'); b.textContent=tele.play?'⏸ Pausar (T)':'▶ Reproducir (T)'; b.classList.toggle('pri',tele.play); }
function setSpeed(v){ tele.speed=Math.max(0.2,Math.min(5,Math.round(v*10)/10)); lsSet('pa_speed',tele.speed); document.getElementById('tspeed').textContent=tele.speed.toFixed(1); }
function setFont(v){ tele.font=Math.max(20,Math.min(64,v)); lsSet('pa_font',tele.font); document.getElementById('tfont').textContent=tele.font; document.getElementById('ttext').style.fontSize=tele.font+'px'; }

/* índice */
function buildOv(){
  let h='';
  [1,2].forEach(d=>{
    h+=`<h2>Día ${d}</h2><div class="ovgrid">`;
    S.forEach((s,i)=>{ if(s.day!==d) return; h+=`<button class="ovc" data-i="${i}"><small>${i-dayStart[d]+1} · ${esc(s.blk)}</small><b>${esc(titleOf(i))}</b><i>${s.min} min · plan ${plannedBefore(i)}′</i></button>`; });
    h+='</div>';
  });
  const ov=document.getElementById('ov'); ov.innerHTML=h+'<p class="keys">Esc para cerrar</p>';
  ov.querySelectorAll('.ovc').forEach(b=>b.onclick=()=>{ go(+b.dataset.i); toggleOv(false); });
}
function toggleOv(v){ const ov=document.getElementById('ov'); ov.classList.toggle('on',typeof v==='boolean'?v:!ov.classList.contains('on')); }

function openProj(){
  const url=location.href.split('#')[0]+'#proyector';
  projWin=window.open(url,'parcelapp_proyector','width=1280,height=760');
  if(!projWin){ toast('El navegador bloqueó la ventana. Permite ventanas emergentes.'); return; }
  setTimeout(()=>send({type:'state',i:st.i,black:st.black}),700);
  setTimeout(()=>send({type:'state',i:st.i,black:st.black}),2000);
}
function copy(txt){
  const done=()=>toast('Prompt copiado');
  try{ navigator.clipboard.writeText(txt).then(done,fallback); }catch(e){ fallback(); }
  function fallback(){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('No se pudo copiar'); } ta.remove(); }
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',1800); }

/* ======================================================================
   TECLADO Y ARRANQUE
   ====================================================================== */
document.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); VIEW==='proj'?(go(st.i+1)):go(st.i+1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(st.i-1); }
  else if(k==='b'||k==='B'||k==='.'){ setBlack(!st.black); }
  else if(k==='f'||k==='F'){ try{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }catch(err){} }
  else if(VIEW==='pres'){
    if(k==='o'||k==='O') toggleOv();
    else if(k==='Escape') toggleOv(false);
    else if(k==='t'||k==='T') togglePlay();
    else if(k==='+'||k==='=') setFont(tele.font+2);
    else if(k==='-') setFont(tele.font-2);
    else if(k===']') setSpeed(tele.speed+0.2);
    else if(k==='[') setSpeed(tele.speed-0.2);
  }
});
function update(broadcast){
  if(VIEW==='proj') updateProj(); else updatePres();
  if(broadcast) send({type:'state',i:st.i,black:st.black});
}
if(VIEW==='proj') buildProj(); else buildPres();
update(false);
setInterval(()=>{ tickCountdowns(); if(VIEW==='pres') tickPres(); },500);
</script>
